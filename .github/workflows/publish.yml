name: Publish qualified artifacts to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  qualified-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Require committed qualification of an exact hosted artifact
        id: qualified
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -I -B scripts/hosted_artifacts.py record
          --record release/QUALIFIED-BUNDLE.json --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"
      - name: Read hosted run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.qualified.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.qualified.outputs.artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > hosted-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > hosted-artifact.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.qualified.outputs.artifact_id }}
          run-id: ${{ steps.qualified.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist/
      - name: Verify qualified bytes, source, report, successful run and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -I -B scripts/hosted_artifacts.py verify
          --record release/QUALIFIED-BUNDLE.json --tag "$RELEASE_TAG"
          --source . --dist dist --run hosted-run.json --artifact hosted-artifact.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: qualified-bundle
    runs-on: ubuntu-latest
    environment: testpypi
    continue-on-error: true
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-dist
          path: dist/
      - name: Publish qualified files to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [qualified-bundle, publish-testpypi]
    if: ${{ always() && needs.qualified-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-dist
          path: dist/
      - name: Publish the same qualified files to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
